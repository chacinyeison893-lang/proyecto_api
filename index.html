<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball Heroes </title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle, #0c0c14 0%, #030308 100%);
      color: #ffffff;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    h1 {
      color: #ffd700;
      text-shadow: 0 0 12px #ff4500, 0 0 25px #ff0000;
      font-size: 2.6rem;
      margin-bottom: 8px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    p {
      color: #aaa;
    }
    /* Buscador y Filtros */
    .search-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      max-width: 600px;
      margin: 0 auto 35px auto;
      flex-wrap: wrap;
    }
    input, select {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 20px;
      border: 2px solid #ffd700;
      background-color: #151525;
      color: #fff;
      outline: none;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
    input {
      flex: 1;
      min-width: 220px;
    }
    /* Grid de Cartas estilo Arcade / DB Heroes */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Diseño de la Carta Arcade / Heroes */
    .hero-card {
      background: linear-gradient(135deg, #282846 0%, #11111f 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 4px solid;
      border-image: linear-gradient(to bottom, #ffe600, #ff8c00, #b8860b) 1;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      padding: 10px;
      text-align: center;
    }
    .hero-card:hover {
      transform: translateY(-10px) scale(1.04);
      box-shadow: 0 12px 30px rgba(255, 215, 0, 0.7), 0 0 25px rgba(255, 69, 0, 0.8);
    }
    /* Insignia superior estilo Arcade */
    .card-header-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffeb3b;
      margin-bottom: 6px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }
    /* Fondo estilo destello/explosión para la imagen */
    .card-img-container {
      background: radial-gradient(circle, rgba(255,230,0,0.3) 0%, rgba(255,69,0,0.1) 70%, transparent 100%);
      border-radius: 8px;
      padding: 5px;
      margin-bottom: 8px;
      position: relative;
      border: 1px dashed rgba(255, 215, 0, 0.4);
    }
    .hero-card img {
      height: 210px;
      width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,0.8));
    }
    .hero-card h3 {
      color: #ffdf00;
      font-size: 1.25rem;
      margin-bottom: 6px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
      font-weight: 800;
    }
    /* Panel de Estadísticas tipo HUD de Cartas */
    .hud-stats {
      background: rgba(10, 10, 20, 0.85);
      border-radius: 6px;
      padding: 6px;
      margin-top: 6px;
      font-size: 0.8rem;
      border: 1px solid #ffb700;
      text-align: left;
    }
    .hud-stats p {
      margin: 3px 0;
      color: #f1f1f1;
      display: flex;
      justify-content: space-between;
    }
    .hud-stats span {
      color: #00e5ff;
      font-weight: bold;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .type-badge {
      background: linear-gradient(135deg, #ff4500, #ff8c00);
      color: #fff;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .power-level {
      color: #00ff66;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .loading {
      text-align: center;
      font-size: 1.5rem;
      color: #ffd700;
      margin-top: 50px;
      text-shadow: 0 0 10px rgba(255,215,0,0.5);
    }
  </style>
</head>
<body>

  <header>
    <h1> DRAGON BALL  </h1>
    <p>Guerreros y Dioses Supremos</p>
  </header>

  <div class="search-container">
    <input type="text" id="input-search" placeholder="Buscar guerrero o dios (ej. Goku, Bills)...">
    <select id="select-race">
      <option value="">Todas las Razas </option>
      <option value="Saiyan">Saiyan</option>
      <option value="God">Dios </option>
      <option value="Namekian">Namekian</option>
      <option value="Frieza Race">Frieza Race</option>
      <option value="Android">Android</option>
    </select>
  </div>

  <div id="loading" class="loading">Invocando baraja arcade... ⚡</div>
  <div id="characters-grid" class="grid-container"></div>

  <script src="script.js"></script>
</body>
</html>
